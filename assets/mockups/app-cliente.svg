<style>svg{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.fi{opacity:0;animation:fi .6s ease-out forwards}@keyframes fi{to{opacity:1}}.bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:cresce 1.3s cubic-bezier(.16,1,.3,1) forwards}@keyframes cresce{to{transform:scaleY(1)}}.hb{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:cresceh 1.4s cubic-bezier(.16,1,.3,1) forwards}@keyframes cresceh{to{transform:scaleX(1)}}.tr{stroke-dasharray:1000;stroke-dashoffset:1000;animation:traca 2.6s ease-out forwards}@keyframes traca{to{stroke-dashoffset:0}}.od{animation:rola cubic-bezier(.16,1,.3,1) both}@keyframes rola{from{transform:translateY(0)}to{transform:translateY(var(--alvo))}}.pulso{animation:pulso 2s ease-in-out infinite}@keyframes pulso{50%{opacity:.3}}.arco{animation:arco 1.8s cubic-bezier(.16,1,.3,1) forwards;stroke-dasharray:0 100}@keyframes arco{to{stroke-dasharray:var(--v) 100}}.flut{animation:flut 5s ease-in-out infinite}@keyframes flut{50%{transform:translateY(-10px)}}.rip{transform-box:fill-box;transform-origin:center;opacity:0;animation:rip 9s linear infinite}@keyframes rip{0%,36%{opacity:0;transform:scale(.3)}38%{opacity:1;transform:scale(.6)}50%{opacity:0;transform:scale(3)}100%{opacity:0}}.toast{opacity:0;animation:toast 9s ease-in-out infinite}@keyframes toast{0%,42%{opacity:0;transform:translateY(20px)}48%,72%{opacity:1;transform:translateY(0)}80%,100%{opacity:0;transform:translateY(20px)}}</style>

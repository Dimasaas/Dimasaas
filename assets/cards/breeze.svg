<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Breeze: Daemon de ventoinha para MacBook com Linux, o servidor do escritório.">
<title>Breeze</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0418"/><stop offset="1" stop-color="#120726"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4D8BFF"/><stop offset="1" stop-color="#FF9CC9"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5EEFF"/><stop offset="1" stop-color="#F5EEFF"/></linearGradient>
<pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#4D8BFF" stroke-opacity=".09"/></pattern>
<clipPath id="c"><rect width="600" height="300" rx="18"/></clipPath>
</defs>
<style>
svg{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.b{animation:corre 5s linear infinite}
@keyframes corre{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.s{animation:varre 6s ease-in-out infinite}
@keyframes varre{from{transform:translateX(-300px)}to{transform:translateX(700px)}}
.pt{animation:pisca 1.2s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}
</style>
<g clip-path="url(#c)">
<rect width="600" height="300" fill="url(#bg)"/>
<rect width="600" height="300" fill="url(#p)"/>
<rect class="s" width="260" height="300" fill="#4D8BFF" opacity=".10"/>
<text x="32" y="42" font-size="13" fill="#C3A8E6">github.com/Dimasaas/breeze</text>
<circle cx="560" cy="37" r="6" fill="#3572A5"/>
<text x="32" y="84" font-size="38" font-weight="700" fill="url(#t)">Breeze<tspan class="pt" fill="#FF9CC9">_</tspan></text>
<text x="32" y="122" font-size="16" fill="#F5EEFF">Daemon de ventoinha para MacBook com Linux, o</text><text x="32" y="146" font-size="16" fill="#F5EEFF">servidor do escritório.</text>
<g><rect x="32" y="244" width="71" height="26" rx="13" fill="#4D8BFF" fill-opacity=".16" stroke="#4D8BFF" stroke-opacity=".7"/><text x="68" y="262" text-anchor="middle" font-size="13" fill="#F5EEFF">Python</text></g><g><rect x="111" y="244" width="63" height="26" rx="13" fill="#4D8BFF" fill-opacity=".16" stroke="#4D8BFF" stroke-opacity=".7"/><text x="142" y="262" text-anchor="middle" font-size="13" fill="#F5EEFF">Linux</text></g><g><rect x="182" y="244" width="79" height="26" rx="13" fill="#4D8BFF" fill-opacity=".16" stroke="#4D8BFF" stroke-opacity=".7"/><text x="222" y="262" text-anchor="middle" font-size="13" fill="#F5EEFF">systemd</text></g><g><rect x="269" y="244" width="112" height="26" rx="13" fill="#FF4FA3" fill-opacity=".16" stroke="#FF4FA3" stroke-opacity=".7"/><text x="325" y="262" text-anchor="middle" font-size="13" fill="#F5EEFF">PolyForm NC</text></g>
</g>
<rect x="1.5" y="1.5" width="597" height="297" rx="17" fill="none" stroke="#4D8BFF" stroke-opacity=".35" stroke-width="1.5"/>
<rect class="b" x="1.5" y="1.5" width="597" height="297" rx="17" fill="none" stroke="url(#g)" stroke-width="3" pathLength="1000" stroke-dasharray="190 810"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Plotline: GeoJSON de lotes → planta em SVG (projeção, rotação, escala), com download do ArcGIS aberto de Goiânia.">
<title>Plotline</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0418"/><stop offset="1" stop-color="#120726"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#FF4FA3"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5EEFF"/><stop offset="1" stop-color="#F5EEFF"/></linearGradient>
<pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7C5CFF" stroke-opacity=".09"/></pattern>
<clipPath id="c"><rect width="600" height="300" rx="18"/></clipPath>
</defs>
<style>
svg{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.b{animation:corre 5s linear infinite}
@keyframes corre{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.s{animation:varre 6s ease-in-out infinite}
@keyframes varre{from{transform:translateX(-300px)}to{transform:translateX(700px)}}
.pt{animation:pisca 1.2s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}
</style>
<g clip-path="url(#c)">
<rect width="600" height="300" fill="url(#bg)"/>
<rect width="600" height="300" fill="url(#p)"/>
<rect class="s" width="260" height="300" fill="#7C5CFF" opacity=".10"/>
<text x="32" y="42" font-size="13" fill="#C3A8E6">github.com/Dimasaas/plotline</text>
<circle cx="560" cy="37" r="6" fill="#CC342D"/>
<text x="32" y="84" font-size="38" font-weight="700" fill="url(#t)">Plotline<tspan class="pt" fill="#FF4FA3">_</tspan></text>
<text x="32" y="122" font-size="16" fill="#F5EEFF">GeoJSON de lotes → planta em SVG (projeção,</text><text x="32" y="146" font-size="16" fill="#F5EEFF">rotação, escala), com download do ArcGIS</text><text x="32" y="170" font-size="16" fill="#F5EEFF">aberto de Goiânia.</text>
<g><rect x="32" y="244" width="54" height="26" rx="13" fill="#7C5CFF" fill-opacity=".16" stroke="#7C5CFF" stroke-opacity=".7"/><text x="59" y="262" text-anchor="middle" font-size="13" fill="#F5EEFF">Ruby</text></g><g><rect x="94" y="244" width="79" height="26" rx="13" fill="#7C5CFF" fill-opacity=".16" stroke="#7C5CFF" stroke-opacity=".7"/><text x="134" y="262" text-anchor="middle" font-size="13" fill="#F5EEFF">GeoJSON</text></g><g><rect x="181" y="244" width="46" height="26" rx="13" fill="#7C5CFF" fill-opacity=".16" stroke="#7C5CFF" stroke-opacity=".7"/><text x="204" y="262" text-anchor="middle" font-size="13" fill="#F5EEFF">SVG</text></g><g><rect x="235" y="244" width="71" height="26" rx="13" fill="#7C5CFF" fill-opacity=".16" stroke="#7C5CFF" stroke-opacity=".7"/><text x="270" y="262" text-anchor="middle" font-size="13" fill="#F5EEFF">ArcGIS</text></g><g><rect x="314" y="244" width="112" height="26" rx="13" fill="#FF4FA3" fill-opacity=".16" stroke="#FF4FA3" stroke-opacity=".7"/><text x="370" y="262" text-anchor="middle" font-size="13" fill="#F5EEFF">PolyForm NC</text></g>
</g>
<rect x="1.5" y="1.5" width="597" height="297" rx="17" fill="none" stroke="#7C5CFF" stroke-opacity=".35" stroke-width="1.5"/>
<rect class="b" x="1.5" y="1.5" width="597" height="297" rx="17" fill="none" stroke="url(#g)" stroke-width="3" pathLength="1000" stroke-dasharray="190 810"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Plotline: GeoJSON de lotes → planta em SVG (projeção, rotação, escala), com download do ArcGIS aberto de Goiânia.">
<title>Plotline</title>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1B2B48"/><stop offset="1" stop-color="#D9482B"/></linearGradient>
<clipPath id="c"><rect width="600" height="300" rx="18"/></clipPath>
</defs>
<style>
svg{font-family:Georgia, serif}
.b{animation:corre 6s linear infinite}
@keyframes corre{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.b{animation:none}}
</style>
<g clip-path="url(#c)">
<rect width="600" height="300" fill="#F3EFE4"/>
<rect width="600" height="6" fill="url(#g)"/>
<circle cx="522" cy="78" r="70" fill="#5B7553" fill-opacity=".10"/>
<image href="data:image/svg+xml;base64," x="470" y="26" width="104" height="104"/>
<text x="32" y="46" font-size="13" fill="#1B2B48" fill-opacity=".72">github.com/Dimasaas/plotline</text>
<text x="32" y="94" font-size="38" font-weight="700" fill="#1B2B48">Plotline</text>
<text x="32" y="132" font-size="16" fill="#1B2B48">GeoJSON de lotes → planta em SVG (projeção,</text><text x="32" y="156" font-size="16" fill="#1B2B48">rotação, escala), com download do ArcGIS</text><text x="32" y="180" font-size="16" fill="#1B2B48">aberto de Goiânia.</text>
<g><rect x="32" y="244" width="54" height="26" rx="13" fill="#1B2B48" fill-opacity=".14" stroke="#1B2B48" stroke-opacity=".8"/><text x="59" y="262" text-anchor="middle" font-size="13" fill="#1B2B48">Ruby</text></g><g><rect x="94" y="244" width="79" height="26" rx="13" fill="#1B2B48" fill-opacity=".14" stroke="#1B2B48" stroke-opacity=".8"/><text x="134" y="262" text-anchor="middle" font-size="13" fill="#1B2B48">GeoJSON</text></g><g><rect x="181" y="244" width="46" height="26" rx="13" fill="#1B2B48" fill-opacity=".14" stroke="#1B2B48" stroke-opacity=".8"/><text x="204" y="262" text-anchor="middle" font-size="13" fill="#1B2B48">SVG</text></g><g><rect x="235" y="244" width="71" height="26" rx="13" fill="#1B2B48" fill-opacity=".14" stroke="#1B2B48" stroke-opacity=".8"/><text x="270" y="262" text-anchor="middle" font-size="13" fill="#1B2B48">ArcGIS</text></g><g><rect x="314" y="244" width="112" height="26" rx="13" fill="#1B2B48" fill-opacity=".14" stroke="#1B2B48" stroke-opacity=".8"/><text x="370" y="262" text-anchor="middle" font-size="13" fill="#1B2B48">PolyForm NC</text></g>
</g>
<rect x="1.5" y="1.5" width="597" height="297" rx="17" fill="none" stroke="#1B2B48" stroke-opacity=".45" stroke-width="1.5"/>
<rect class="b" x="1.5" y="1.5" width="597" height="297" rx="17" fill="none" stroke="url(#g)" stroke-width="3" pathLength="1000" stroke-dasharray="140 860"/>
</svg>

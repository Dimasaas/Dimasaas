<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="RendeChapa: Plano de corte de chapas para marcenaria (otimizador guilhotinado).">
<title>RendeChapa</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0624"/><stop offset="1" stop-color="#08143a"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B388FF"/><stop offset="1" stop-color="#2979FF"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9ccff"/></linearGradient>
<pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#B388FF" stroke-opacity=".09"/></pattern>
<clipPath id="c"><rect width="600" height="300" rx="18"/></clipPath>
</defs>
<style>
svg{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.b{animation:corre 5s linear infinite}
@keyframes corre{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.s{animation:varre 6s ease-in-out infinite}
@keyframes varre{from{transform:translateX(-300px)}to{transform:translateX(700px)}}
.pt{animation:pisca 1.2s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}
</style>
<g clip-path="url(#c)">
<rect width="600" height="300" fill="url(#bg)"/>
<rect width="600" height="300" fill="url(#p)"/>
<rect class="s" width="260" height="300" fill="#B388FF" opacity=".10"/>
<text x="32" y="42" font-size="13" fill="#8f7fd1">github.com/Dimasaas/RendeChapa</text>
<circle cx="560" cy="37" r="6" fill="#3178C6"/>
<text x="32" y="84" font-size="38" font-weight="700" fill="url(#t)">RendeChapa<tspan class="pt" fill="#2979FF">_</tspan></text>
<text x="32" y="122" font-size="16" fill="#cfc4f5">Plano de corte de chapas para marcenaria</text><text x="32" y="146" font-size="16" fill="#cfc4f5">(otimizador guilhotinado).</text>
<g><rect x="32" y="244" width="104" height="26" rx="13" fill="#B388FF" fill-opacity=".16" stroke="#B388FF" stroke-opacity=".7"/><text x="84" y="262" text-anchor="middle" font-size="13" fill="#efe9ff">TypeScript</text></g><g><rect x="144" y="244" width="79" height="26" rx="13" fill="#B388FF" fill-opacity=".16" stroke="#B388FF" stroke-opacity=".7"/><text x="184" y="262" text-anchor="middle" font-size="13" fill="#efe9ff">Node.js</text></g><g><rect x="231" y="244" width="104" height="26" rx="13" fill="#B388FF" fill-opacity=".16" stroke="#B388FF" stroke-opacity=".7"/><text x="283" y="262" text-anchor="middle" font-size="13" fill="#efe9ff">PostgreSQL</text></g>
</g>
<rect x="1.5" y="1.5" width="597" height="297" rx="17" fill="none" stroke="#B388FF" stroke-opacity=".35" stroke-width="1.5"/>
<rect class="b" x="1.5" y="1.5" width="597" height="297" rx="17" fill="none" stroke="url(#g)" stroke-width="3" pathLength="1000" stroke-dasharray="190 810"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Penny: Dinheiro em centavos inteiros, rateio por maiores restos e boleto ITF em SVG.">
<title>Penny</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0624"/><stop offset="1" stop-color="#08143a"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C4DFF"/><stop offset="1" stop-color="#00E5FF"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9ccff"/></linearGradient>
<pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7C4DFF" stroke-opacity=".09"/></pattern>
<clipPath id="c"><rect width="600" height="300" rx="18"/></clipPath>
</defs>
<style>
svg{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.b{animation:corre 5s linear infinite}
@keyframes corre{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.s{animation:varre 6s ease-in-out infinite}
@keyframes varre{from{transform:translateX(-300px)}to{transform:translateX(700px)}}
.pt{animation:pisca 1.2s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}
</style>
<g clip-path="url(#c)">
<rect width="600" height="300" fill="url(#bg)"/>
<rect width="600" height="300" fill="url(#p)"/>
<rect class="s" width="260" height="300" fill="#7C4DFF" opacity=".10"/>
<text x="32" y="42" font-size="13" fill="#8f7fd1">github.com/Dimasaas/penny</text>
<circle cx="560" cy="37" r="6" fill="#CC342D"/>
<text x="32" y="84" font-size="38" font-weight="700" fill="url(#t)">Penny<tspan class="pt" fill="#00E5FF">_</tspan></text>
<text x="32" y="122" font-size="16" fill="#cfc4f5">Dinheiro em centavos inteiros, rateio por</text><text x="32" y="146" font-size="16" fill="#cfc4f5">maiores restos e boleto ITF em SVG.</text>
<g><rect x="32" y="244" width="54" height="26" rx="13" fill="#7C4DFF" fill-opacity=".16" stroke="#7C4DFF" stroke-opacity=".7"/><text x="59" y="262" text-anchor="middle" font-size="13" fill="#efe9ff">Ruby</text></g><g><rect x="94" y="244" width="46" height="26" rx="13" fill="#7C4DFF" fill-opacity=".16" stroke="#7C4DFF" stroke-opacity=".7"/><text x="117" y="262" text-anchor="middle" font-size="13" fill="#efe9ff">ITF</text></g><g><rect x="148" y="244" width="46" height="26" rx="13" fill="#7C4DFF" fill-opacity=".16" stroke="#7C4DFF" stroke-opacity=".7"/><text x="171" y="262" text-anchor="middle" font-size="13" fill="#efe9ff">SVG</text></g><g><rect x="202" y="244" width="112" height="26" rx="13" fill="#00E5FF" fill-opacity=".16" stroke="#00E5FF" stroke-opacity=".7"/><text x="258" y="262" text-anchor="middle" font-size="13" fill="#efe9ff">PolyForm NC</text></g>
</g>
<rect x="1.5" y="1.5" width="597" height="297" rx="17" fill="none" stroke="#7C4DFF" stroke-opacity=".35" stroke-width="1.5"/>
<rect class="b" x="1.5" y="1.5" width="597" height="297" rx="17" fill="none" stroke="url(#g)" stroke-width="3" pathLength="1000" stroke-dasharray="190 810"/>
</svg>

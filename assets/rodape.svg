<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="Fim da transmissão do DIAMANTINO.OS">
<title>DIAMANTINO.OS — fim da transmissão</title>
<defs>
<linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120726" stop-opacity="0"/><stop offset="1" stop-color="#2b0f52"/></linearGradient>
<linearGradient id="sol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB86B"/><stop offset="1" stop-color="#FF4FA3"/></linearGradient>
<linearGradient id="chao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0836"/><stop offset="1" stop-color="#0a0418"/></linearGradient>

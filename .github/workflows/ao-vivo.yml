name: Ao vivo

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar o LAPIDÁRIO.EXE e o RELÓGIO DO ANO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/gerar_jogo.py --usuario "${{ github.repository_owner }}" --saida dist/jogo.svg
          python scripts/gerar_relogio.py --usuario "${{ github.repository_owner }}" --saida dist/relogio.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

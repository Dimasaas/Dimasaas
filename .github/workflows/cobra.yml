name: Cobra

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobra.svg?color_snake=#7C5CFF&color_dots=#efe6ff,#e0c4f0,#c4a8ff,#9dbbff,#FF4FA3
            dist/cobra-escura.svg?color_snake=#FFB86B&color_dots=#1e0d3d,#3b1a73,#7C5CFF,#4D8BFF,#FF4FA3
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

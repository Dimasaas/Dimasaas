name: Cobra

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobra.svg?color_snake=#1b3a8a&color_dots=#ebe7f7,#d1c4ff,#b388ff,#7c4dff,#2a1052
            dist/cobra-escura.svg?color_snake=#00E5FF&color_dots=#161233,#2a1052,#4527a0,#7C4DFF,#2979FF&dark_color_dots=#161233,#2a1052,#4527a0,#7C4DFF,#2979FF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
